<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Inventario TI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #000;
      color: #00ff66;
      font-family: 'Share Tech Mono', Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 255, 102, 0.03) 0px,
        rgba(0, 255, 102, 0.03) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 0;
    }
    .wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 520px;
    }
    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 1.5rem;
      border: 2px solid #00ff66;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(0, 255, 102, 0.35), inset 0 0 20px rgba(0, 255, 102, 0.08);
      animation: pulse 3s ease-in-out infinite;
    }
    .logo svg { width: 52px; height: 52px; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 24px rgba(0, 255, 102, 0.35), inset 0 0 20px rgba(0, 255, 102, 0.08); }
      50% { box-shadow: 0 0 40px rgba(0, 255, 102, 0.55), inset 0 0 28px rgba(0, 255, 102, 0.12); }
    }
    h1 {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      letter-spacing: 0.25em;
      text-shadow: 0 0 12px rgba(0, 255, 102, 0.6);
      margin-bottom: 0.5rem;
    }
    .sub {
      color: #00bb55;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
    .btn {
      display: inline-block;
      width: 100%;
      max-width: 320px;
      padding: 1rem 2rem;
      background: transparent;
      border: 2px solid #00ff66;
      color: #00ff66;
      text-decoration: none;
      font-family: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      transition: all 0.25s ease;
      box-shadow: 0 0 16px rgba(0, 255, 102, 0.2);
    }
    .btn:hover {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 32px rgba(0, 255, 102, 0.6);
    }
    .btn-primary {
      background: #00ff66;
      color: #000;
      font-weight: bold;
    }
    .btn-primary:hover {
      background: transparent;
      color: #00ff66;
    }
    .note {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #008844;
      line-height: 1.7;
      max-width: 400px;
    }
    footer {
      position: fixed;
      bottom: 1rem;
      font-size: 0.7rem;
      color: #006633;
      z-index: 1;
    }
    footer a { color: #00bb55; text-decoration: none; }
    footer a:hover { color: #00ff66; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="12" width="48" height="32" rx="2" stroke="#00ff66" stroke-width="2"/>
        <rect x="14" y="18" width="36" height="20" rx="1" fill="#00ff66" fill-opacity="0.15"/>
        <path d="M32 44 L20 52 H44 L32 44Z" stroke="#00ff66" stroke-width="2" fill="#00ff66" fill-opacity="0.1"/>
        <circle cx="32" cy="28" r="6" stroke="#00ff66" stroke-width="2"/>
        <path d="M32 22 V18 M32 34 V38 M26 28 H22 M38 28 H42" stroke="#00ff66" stroke-width="1.5"/>
      </svg>
    </div>
    <h1>INVENTARIO TI</h1>
    <p class="sub">Control de equipos · Escaneo de hardware<br>100% local · Portable · Windows 11</p>
    <div class="actions">
      <a class="btn btn-primary" href="inventario.html">DESCARGAR INVENTARIO.EXE</a>
      <a class="btn" href="https://github.com/RUGDRAIGER/matrix_inventario/releases/latest/download/matrix_inventario_portable.zip">
        PAQUETE COMPLETO (ZIP + DB)
      </a>
    </div>
    <p class="note">
      <strong>Inventario.exe</strong>: solo el programa, sin Python.<br>
      <strong>Paquete ZIP</strong>: ejecutable + base de datos + Iniciar.bat para pendrive.
    </p>
  </div>
  <footer>
    <a href="https://github.com/RUGDRAIGER/matrix_inventario" target="_blank" rel="noopener">GitHub</a>
  </footer>
</body>
</html>
